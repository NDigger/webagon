<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'"> -->
    <title>Webagon</title>
    <style>
        body {
            background-color: black;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="override-flash-effect" class="override"></div>
    <div id="game-content">
        <div id="game-ui">
            <div class="top-left">
                <p id="timer"></p>
                <p id="restart-help-msg">Press [Enter] or [ArrowUp] to restart.</p>
                <p id="fps-counter"></p>
                <p id="swap-enabled-msg">Swap Enabled</p>
            </div>
            <div class="top-right screen-only">
                <button id="level-restart-btn"><i class="bi bi-arrow-clockwise"></i></button>
                <button id="level-leave-btn"><i class="bi bi-pause"></i></button>
            </div>
        </div>
        <div id="game-controls">
            <button id="game-arrow-left">Left</button>
            <button id="game-arrow-right">Right</button>
        </div>
    </div>
    <section id="level-select">
        <div id="level-list">
        </div>
        <div id="selected-level" class="hide">
            <div id="selected-level-top" class="top">
                <p class="title-name"></p>
                <h1>Personal best:</h1>
                <p id="selected-level-best" class="best"></p>
                <!-- <button id="play-btn">PLAY</button> -->
            </div>

            <div>
                <div class="level-info">
                    <button id="close-selected-level">X</button>
                </div>
                <div class="tab">                
                    <h1 class="title">Music Info</h1>
                    <p class="music-name"></p>
                    <p class="music-author"></p>
                    <p class="music-album"></p>
                </div>
                <div class="tab">   
                    <h1 class="title">Level Info</h1>
                    <p class="name"></p>
                    <p class="author"></p>
                    <p class="description"></p>
                </div>
            </div>
        </div>
        <!-- <canvas width="1600" height="1080" id="level-select-background"></canvas> -->
    </section>
    <script type="module" src="./script.js"></script>
</body>
</html>
