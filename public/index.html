<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webagon</title>
    <style>
        body {
            background-color: black;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-content">
        <div id="game-ui">
            <div class="top-left">
                <p id="timer"></p>
                <p id="restart-help-msg">Press [Enter] or [ArrowUp] to restart.</p>
                <p id="fps-counter"></p>
                <p id="swap-enabled-msg">Swap Enabled</p>
            </div>
        </div>
    </div>
    <section id="level-select">
        <div id="level-list">
        </div>
        <div id="selected-level-info">
            <div>
                <p class="title-name"></p>
                <div class="music">                
                    <h1>Music Info</h1>
                    <p class="music-name"></p>
                    <p class="music-author"></p>
                    <p class="music-album"></p>
                </div>
                <h1>Level Info</h1>
                <p class="name"></p>
                <p class="author"></p>
                <p class="description"></p>
            </div>
            <div class="bottom">
                <p>Personal best:</p>
                <p class="best"></p>
                <button id="play-btn">PLAY</button>
            </div>
        </div>
        <!-- <canvas width="1600" height="1080" id="level-select-background"></canvas> -->
    </section>
    <script type="module" src="./script.js"></script>
</body>
</html>
